# Vehicle profile: 2017 Nissan Frontier (crew cab, double-DIN, factory backup camera)
VEHICLE_ID=frontier
VEHICLE_NAME="2017 Nissan Frontier"
AUDIO_CHANNELS=4
DEFAULT_THEME=after-midnight
POWER_MODE=diy
ACC_GPIO=3
ILLUM_GPIO=4
REVERSE_GPIO=5
HOLD_GPIO=26
AMP_GPIO=27
ANT_GPIO=
# Nissan feeds the antenna amp from the radio harness's power-antenna wire; keep it on with the radio:
ANT_ALWAYS_ON=1
SHUTDOWN_DELAY=20
AMP_ON_DELAY=6
# 2-DIN screen: hdmi-1024x600 (7" 1024x600 HDMI, e.g. Orient Display 900-nit) or pi-touch-display-2 (official 7" DSI)
DISPLAY_TYPE=hdmi-1024x600
DISPLAY_ROTATE=0
# Factory backup camera through a USB composite-video capture stick
CAMERA=1
CAMERA_OFF_DELAY=2
MAP_REGION=texas-plus
# Steering-wheel controls: key wires on MCP3008 channels 0-3 (unused channels are ignored by --learn)
SWC=1
SWC_CHANNELS=0,1,2,3
# Override any button's Hudiy action, e.g. SWC_ACTION_MODE=applications_menu
