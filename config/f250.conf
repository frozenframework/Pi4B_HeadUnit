# Vehicle profile: 1997 Ford F-250 7.3L Power Stroke (crew cab)
VEHICLE_ID=f250
VEHICLE_NAME="1997 Ford F-250 7.3L"
AUDIO_CHANNELS=4
DEFAULT_THEME=street-heat
# Power: diy = relay latch + optocoupler (tiers 1-2), carpihat = CarPiHAT (tier 3), none = bench testing
POWER_MODE=diy
ACC_GPIO=3
ILLUM_GPIO=4
HOLD_GPIO=26
AMP_GPIO=27
ANT_GPIO=22
# Seconds with the key off before the Pi shuts down. Long on the diesel so a stall/restart or a
# long glow-plug wait doesn't power-cycle the head unit.
SHUTDOWN_DELAY=60
AMP_ON_DELAY=6
DISPLAY_ROTATE=90
MAP_REGION=texas-plus
