# Vehicle profile: 1997 Mazda Miata (2 door speakers)
VEHICLE_ID=miata
VEHICLE_NAME="1997 Mazda Miata"
AUDIO_CHANNELS=2
DEFAULT_THEME=sunset-junction
POWER_MODE=diy
ACC_GPIO=3
ILLUM_GPIO=4
HOLD_GPIO=26
AMP_GPIO=27
ANT_GPIO=22
SHUTDOWN_DELAY=20
AMP_ON_DELAY=6
DISPLAY_TYPE=waveshare-7.9
DISPLAY_ROTATE=90
CAMERA=0
SWC=0
MAP_REGION=texas-plus

# Software updates: signed releases from GitHub (bin/hu-update.py). UPDATES=0 turns checks off.
UPDATES=1
# Pi Wi-Fi: client = joins home Wi-Fi / phone hotspot (needed for updates);
#           hudiy-hotspot = Hudiy uses it for wireless Android Auto instead (no Wi-Fi updates)
PI_WIFI=client
