# What each budget tier turns on. Matches the parts list spreadsheet.
TIER1="RADIO=0 GPS=0 CARPLAY=0"
TIER2="RADIO=0 GPS=1 CARPLAY=1"
TIER3="RADIO=1 GPS=1 CARPLAY=1 POWER_MODE=carpihat"

# Per-vehicle overrides (used instead of the lines above when present).
# Frontier: no CarPiHAT (the steering-wheel ADC board uses the Pi header); tiers 1-2 use the Pi Touch Display 2.
FRONTIER_TIER1="RADIO=0 GPS=0 CARPLAY=0 CAMERA=0 SWC=0 DISPLAY_TYPE=pi-touch-display-2 DISPLAY_ROTATE=90"
FRONTIER_TIER2="RADIO=0 GPS=1 CARPLAY=1 CAMERA=1 SWC=0 DISPLAY_TYPE=pi-touch-display-2 DISPLAY_ROTATE=90"
FRONTIER_TIER3="RADIO=0 GPS=1 CARPLAY=1 CAMERA=1 SWC=1 DISPLAY_TYPE=hdmi-1024x600 DISPLAY_ROTATE=0"
