<!doctype html>
<!-- Hudiy opens this local file first; it waits for the head-unit service, then jumps to the app.
     It checks with an image load, not fetch(): Hudiy's web view (QtWebEngine) doesn't let local file://
     pages make fetch/XHR requests to http:// addresses, but ordinary image loads are allowed. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#07060d;color:#8b86b8;font:24px system-ui;display:grid;place-items:center;text-align:center}
small{display:block;margin-top:14px;font-size:17px;opacity:.8}
</style></head><body><div id="m">Starting…</div><script>
const page = new URLSearchParams(location.search).get('to') || 'nav';
const to = /^[a-z]+$/.test(page) ? page : 'nav';
const base = 'http://127.0.0.1:8765';
let n = 0;
(function wait() {
  const probe = new Image();
  probe.onload = () => location.replace(`${base}/apps/${to}/index.html`);
  probe.onerror = () => {
    if (n++ > 20) document.getElementById('m').innerHTML = 'Head-unit service not responding. Still trying…' +
      '<small>Ctrl+Alt+T opens a terminal: systemctl --user restart headunit-bridge</small>';
    setTimeout(wait, 1000);
  };
  probe.src = `${base}/apps/common/ping.png?t=${Date.now()}`;
})();
</script></body></html>
