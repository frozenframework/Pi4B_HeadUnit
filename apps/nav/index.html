<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Navigation</title>
<link rel="stylesheet" href="../lib/maplibre-gl.css">
<link rel="stylesheet" href="../common/hu.css">
<link rel="stylesheet" href="nav.css">
</head>
<body data-app="nav">
<!-- everything from the map screen: Map, iPod & USB, AM/FM Radio, Head Unit Settings -->
<nav id="rail" class="panel">
  <button data-app-btn="map" class="on" data-log="app_map"><span class="ico"></span><span class="lbl" data-i18n="nav.app_map">Map</span></button>
  <button data-app-btn="music" data-log="app_music"><span class="ico"></span><span class="lbl" data-i18n="nav.app_music">Music</span></button>
  <button data-app-btn="radio" data-log="app_radio"><span class="ico"></span><span class="lbl" data-i18n="nav.app_radio">Radio</span></button>
  <button data-app-btn="settings" data-log="app_settings"><span class="ico"></span><span class="lbl" data-i18n="nav.app_settings">Settings</span></button>
</nav>
<div id="map"></div>
<div id="nightveil" class="hidden"></div>

<!-- turn-by-turn panel (left) -->
<section id="guide" class="panel hidden">
  <div class="man">
    <div id="manIcon"></div>
    <div>
      <div id="manDist" class="glow"></div>
      <div id="manText"></div>
    </div>
  </div>
  <div id="thenRow" class="muted"></div>
  <div class="eta">
    <div><div id="etaTime" class="accent"></div><div class="lbl" data-i18n="nav.arrival">arrival</div></div>
    <div><div id="etaLeft"></div><div class="lbl" data-i18n="nav.remaining">remaining</div></div>
    <div><div id="etaDist"></div><div class="lbl" data-i18n="nav.distance">distance</div></div>
  </div>
  <button id="endBtn" data-log="nav_end" data-i18n="nav.end">End route</button>
</section>

<!-- speed + street (bottom left when not navigating) -->
<div id="speedo" class="panel"><span id="speed">--</span><small id="speedUnit">mph</small></div>
<div id="street" class="panel hidden"></div>

<!-- right-side buttons -->
<div id="contactsChip" class="panel hidden"><div class="ctext"></div><div class="cbarw"><div class="cbar"></div></div></div>
<nav id="fabs">
  <button id="searchBtn" data-log="open_search" aria-label="Search" data-i18n-aria="nav.search"></button>
  <button id="favBtn" data-log="open_favorites" aria-label="Places" data-i18n-aria="nav.places"></button>
  <button id="centerBtn" data-log="recenter" aria-label="Recenter" data-i18n-aria="nav.recenter"></button>
  <button id="themeBtn" data-log="open_theme" aria-label="Map skin" data-i18n-aria="nav.skin"></button>
  <button id="phoneBtn" class="hidden" data-log="phone_show" aria-label="CarPlay" data-i18n-aria="nav.phone_screen"></button>
</nav>

<!-- destination sheet (after long-press) -->
<section id="destSheet" class="panel hidden">
  <div><div id="destName"></div><div id="destSub" class="muted"></div></div>
  <div class="row">
    <button id="destFav" class="ghost" data-log="dest_fav" aria-label="Save place" data-i18n-aria="nav.save_place"></button>
    <button id="destCancel" class="ghost" data-log="dest_cancel" data-i18n="common.cancel">Cancel</button>
    <button id="destGo" class="primary" data-log="dest_go" data-i18n="nav.go">Go</button>
  </div>
</section>

<!-- search -->
<section id="searchPanel" class="sheet panel hidden">
  <div class="sheetHead row">
    <button class="ghost closeBtn" data-log="close_search" aria-label="Close" data-i18n-aria="common.close"></button>
    <div id="searchBox"><span id="searchText"></span><span class="caret"></span></div>
  </div>
  <div class="split">
    <div id="results" class="list"></div>
    <div id="kbd"></div>
  </div>
</section>

<!-- favorites -->
<section id="favPanel" class="sheet panel hidden">
  <div class="sheetHead row"><button class="ghost closeBtn" data-log="close_fav" aria-label="Close" data-i18n-aria="common.close"></button><h2 data-i18n="nav.places">Places</h2>
    <button id="bookBtn" class="ghost" data-log="places_book"><span data-i18n="nav.book">Address book</span></button>
    <button id="clearHist" class="ghost" data-log="places_clear_history" data-i18n="nav.clear_history">Clear history</button></div>
  <div id="placeTiles" class="tiles"></div>
  <div id="favList" class="list"></div>
</section>
<!-- address book: the phone's contacts (bin/hu_contacts.py), A to Z, pick a person's address -->
<section id="bookPanel" class="sheet panel hidden">
  <div class="sheetHead row"><button id="bookBack" class="ghost backBtn" data-log="close_book" aria-label="Back" data-i18n-aria="common.back"></button>
    <h2 data-i18n="nav.book">Address book</h2><span id="bookFrom" class="muted"></span></div>
  <div class="bookSplit">
    <div id="bookList" class="list"></div>
    <div id="bookIndex"></div>
  </div>
</section>
<!-- small chooser (Save as Home / Work / ..., Set Home: where I am / search) -->
<section id="chooser" class="panel hidden">
  <div class="sheetHead row"><button id="chooseClose" class="ghost closeBtn" aria-label="Close" data-i18n-aria="common.close"></button><h2 id="chooseTitle"></h2></div>
  <div id="chooseList" class="chooseGrid"></div>
</section>

<!-- skin picker -->
<section id="themePanel" class="sheet panel hidden">
  <div class="sheetHead row"><button class="ghost closeBtn" data-log="close_theme" aria-label="Close" data-i18n-aria="common.close"></button><h2 data-i18n="nav.skin">Map skin</h2>
    <button id="moreSettings" class="ghost" data-log="more_settings" data-i18n="nav.more_settings">More settings</button></div>
  <div id="themeCards"></div>
</section>

<!-- from the phone (CarPlay / Android Auto through Hudiy): its next turn, now playing, call -->
<section id="phoneTurn" class="panel hidden">
  <div id="ptIcon"></div>
  <div class="ptBody"><div id="ptDist" class="glow"></div><div id="ptText"></div></div>
  <div id="ptSrc" class="muted"></div>
</section>
<div id="callChip" class="panel hidden"></div>
<div id="nowPlaying" class="panel hidden">
  <img id="npCover" alt="">
  <div class="npText"><div id="npTitle"></div><div id="npArtist" class="muted"></div></div>
  <button id="npPrev" class="ghost" data-log="phone_prev" aria-label="Previous"></button>
  <button id="npPlay" class="ghost" data-log="phone_play" aria-label="Play or pause"></button>
  <button id="npNext" class="ghost" data-log="phone_next" aria-label="Next"></button>
</div>

<!-- iPod & USB, AM/FM Radio and Head Unit Settings open on top of the map (the map and any route keep
     running underneath; music and radio keep playing when you go back to the map) -->
<section id="appLayer" class="hidden"></section>

<div id="nomaps" class="panel hidden">
  <h2 data-i18n="nav.nomaps_title">Offline maps aren't installed yet</h2>
  <p data-i18n="nav.nomaps_body">Connect to Wi-Fi and run Update maps in Settings, or plug in a USB stick with a HEADUNIT_MAPS folder.</p>
</div>
<script type="module" src="nav.js"></script>
</body>
</html>
